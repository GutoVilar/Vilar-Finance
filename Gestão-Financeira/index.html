<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vilar Finance | Dashboard Pessoal</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js para os gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container nav-container">
      <a href="#" class="logo">Vilar<span>Finance</span></a>
      <p class="user-welcome">Painel de Gestão & Métricas</p>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="container dashboard-layout">

    <!-- COLUNA ESQUERDA: CARDS DE RESUMO E FORMULÁRIO -->
    <section class="left-column">
      
      <!-- CARDS DE MÉTRICAS -->
      <div class="metrics-grid">
        <div class="metric-card income">
          <span>Receitas</span>
          <h2 id="totalIncome">R$ 0,00</h2>
        </div>
        <div class="metric-card expense">
          <span>Despesas</span>
          <h2 id="totalExpense">R$ 0,00</h2>
        </div>
        <div class="metric-card balance">
          <span>Saldo Atual</span>
          <h2 id="netBalance">R$ 0,00</h2>
        </div>
      </div>

      <!-- FORMULÁRIO DE LANÇAMENTO -->
      <div class="card form-card">
        <h3>Nova Movimentação</h3>
        <form id="transactionForm" class="transaction-form">
          <div class="form-group">
            <label for="description">Descrição *</label>
            <input type="text" id="description" placeholder="Ex: Salário, Faculdade, Conta de Celular..." required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Valor (R$) *</label>
              <input type="number" id="amount" step="0.01" placeholder="0.00" required>
            </div>
            <div class="form-group">
              <label for="type">Tipo *</label>
              <select id="type">
                <option value="income">Receita</option>
                <option value="expense">Despesa</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="category">Categoria *</label>
            <select id="category">
              <option value="Trabalho / Salário">Trabalho / Salário</option>
              <option value="Alimentação">Alimentação</option>
              <option value="Moradia">Moradia</option>
              <option value="Telefone">Telefone</option>
              <option value="Estudos">Estudos</option>
              <option value="Lazer">Lazer</option>
              <option value="Transporte">Transporte</option>
              <option value="Outros">Outros</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Adicionar Transação</button>
        </form>
      </div>

    </section>

    <!-- COLUNA DIREITA: GRÁFICO E EXTRATO -->
    <section class="right-column">
      
      <!-- GRÁFICO -->
      <div class="card chart-card">
        <h3>Despesas por Categoria</h3>
        <div class="chart-container">
          <canvas id="expenseChart"></canvas>
        </div>
      </div>

      <!-- EXTRATO RECENTE -->
      <div class="card history-card">
        <div class="history-header">
          <h3>Histórico de Lançamentos</h3>
          <button id="clearAllBtn" class="btn-text">Limpar Tudo</button>
        </div>
        <div id="transactionsList" class="transactions-list">
          <!-- Preenchido via JavaScript -->
        </div>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
